name: proofs

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit-cas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: CAS coordination tests
        run: dotnet test tests/WebApi.Tests/WebApi.Tests.csproj -c Release --verbosity normal

  multi-node-http:
    runs-on: ubuntu-latest
    needs: unit-cas
    steps:
      - uses: actions/checkout@v4
      - name: Start two API nodes + Postgres
        run: docker compose -f docker-compose.multi.yml up --build -d
      - name: Wait for readiness on both nodes
        run: |
          set -e
          for i in $(seq 1 60); do
            A=$(curl -sf http://localhost:5073/health/ready | jq -r .status || echo fail)
            B=$(curl -sf http://localhost:5075/health/ready | jq -r .status || echo fail)
            echo "try $i A=$A B=$B"
            if [ "$A" = "Healthy" ] && [ "$B" = "Healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.multi.yml logs
          exit 1
      - name: HTTP proofs across A and B
        run: |
          chmod +x tools/proofs/http-proofs.sh
          BASE_A=http://localhost:5073 BASE_B=http://localhost:5075 ./tools/proofs/http-proofs.sh
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.multi.yml down -v
